<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Page Not Found · Eyuel Mulat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;600&display=block" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Hanken Grotesk', sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Giant 404 backdrop ── */
    .backdrop {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      user-select: none;
    }

    .digit {
      font-family: 'Anton', 'Impact', 'Arial Black', sans-serif;
      font-size: clamp(280px, 42vw, 680px);
      line-height: 0.82;
      color: #FF4F00;
      letter-spacing: -0.02em;
      position: absolute;
    }

    .digit-left {
      left: -12vw;
      filter: blur(18px) brightness(0.7);
      opacity: 0.9;
    }

    .digit-center {
      filter: blur(0px);
      opacity: 1;
      text-shadow:
        0 0 120px rgba(255, 79, 0, 0.35),
        0 0 40px  rgba(255, 79, 0, 0.2);
    }

    .digit-right {
      right: -12vw;
      filter: blur(18px) brightness(0.7);
      opacity: 0.9;
    }

    /* vignette overlay */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
    }

    /* ── Center content ── */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .eyebrow {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 12px;
    }

    .label {
      font-family: 'Anton', 'Impact', sans-serif;
      font-size: clamp(13px, 1.6vw, 18px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 6px;
    }

    .tagline {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: clamp(10px, 1.1vw, 13px);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 40px;
    }

    /* nav links */
    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 6px;
      margin-bottom: 32px;
    }

    .nav a {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      padding: 7px 16px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 2px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      white-space: nowrap;
    }

    .nav a:hover {
      color: #FF4F00;
      border-color: #FF4F00;
      background: rgba(255,79,0,0.06);
    }

    .nav a.home {
      color: #fff;
      border-color: rgba(255,255,255,0.35);
    }

    .nav a.home:hover {
      color: #FF4F00;
      border-color: #FF4F00;
    }

    .bottom-label {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      line-height: 1.8;
      text-align: center;
    }

    /* top corner label */
    .corner-label {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      z-index: 20;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <div class="corner-label">404<br>Error Page</div>

  <!-- Giant blurred backdrop digits -->
  <div class="backdrop">
    <span class="digit digit-left">4</span>
    <span class="digit digit-center">0</span>
    <span class="digit digit-right">4</span>
  </div>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Center content -->
  <div class="content">
    <p class="eyebrow">Eyuel Mulat</p>
    <p class="label">404</p>
    <p class="tagline">Sorry, we couldn't find this page</p>

    <nav class="nav">
      <a href="/" class="home">↖ Go Home</a>
      <a href="/about.html">About</a>
      <a href="/work.html">Work</a>
      <a href="/insights.html">Insights</a>
      <a href="/contact.html">Contact</a>
    </nav>

    <p class="bottom-label">
      The page you are looking for doesn't exist<br>or an error occurred.
    </p>
  </div>

</body>
</html>
